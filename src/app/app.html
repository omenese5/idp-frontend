<ng-container *ngIf="!currentUser">
  <router-outlet></router-outlet>
</ng-container>

<div *ngIf="currentUser" class="flex h-screen overflow-hidden bg-slate-50">
  
  <div class="flex flex-col w-72 bg-slate-900 text-slate-300 shadow-2xl transition-all duration-300">
    
    <div class="flex items-center justify-center h-20 border-b border-slate-800 bg-slate-950">
      <a href="/" class="flex items-center space-x-3 text-decoration-none group">
        <div class="w-9 h-9 bg-indigo-600 text-white rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:bg-indigo-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
          </svg>
        </div>
        <span class="text-lg font-semibold tracking-wide text-slate-100 group-hover:text-white transition-colors">Zalgodyne</span>
      </a>
    </div>

    <div class="flex-1 overflow-y-auto py-6 px-4">
      <ul class="space-y-1">
        
        <li>
          <a routerLink="/deploy" 
             routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-900/20" 
             class="flex items-center p-3 rounded-lg hover:bg-slate-800 hover:text-white transition-all duration-200 cursor-pointer group">
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-indigo-400 transition-colors">
               <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.631 8.41m5.96 5.96a14.926 14.926 0 01-5.841 2.58m-.119-8.54a6 6 0 00-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 00-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 01-2.448-2.448 14.9 14.9 0 01.06-.312m-2.24 2.39a4.493 4.493 0 00-1.757 4.306 4.493 4.493 0 004.306-1.758M16.5 9a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" />
             </svg>
             <span class="font-medium text-sm">Despliegue</span>
          </a>
        </li>

        <li>
          <a routerLink="/containers" 
             routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-900/20" 
             class="flex items-center p-3 rounded-lg hover:bg-slate-800 hover:text-white transition-all duration-200 cursor-pointer group">
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-indigo-400 transition-colors">
               <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
             </svg>
             <span class="font-medium text-sm">Contenedores</span>
          </a>
        </li>

        <li>
          <a routerLink="/metrics" 
             routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-900/20" 
             class="flex items-center p-3 rounded-lg hover:bg-slate-800 hover:text-white transition-all duration-200 cursor-pointer group">
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-indigo-400 transition-colors">
               <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
             </svg>
             <span class="font-medium text-sm">Métricas</span>
          </a>
        </li>

      </ul>
    </div>

    <div class="p-4 border-t border-slate-800 bg-slate-950">
      <div class="flex items-center justify-between w-full p-2 rounded-lg bg-slate-900 border border-slate-800 group">
        
        <div class="flex items-center overflow-hidden">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex-shrink-0 flex items-center justify-center border border-indigo-400 text-white font-bold shadow-sm">
                {{ currentUser?.username?.charAt(0)?.toUpperCase() || 'U' }}
            </div>
            
            <div class="flex flex-col ml-3 min-w-0">
              <strong class="text-sm text-slate-200 truncate capitalize">{{ currentUser?.username || 'Usuario' }}</strong>
            </div>
        </div>

        <button (click)="logout()" class="ml-2 text-slate-500 hover:text-red-400 transition-colors p-2 rounded-full hover:bg-slate-800 focus:outline-none" title="Cerrar Sesión">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
        </button>

      </div>
    </div>

  </div>

  <div class="flex-1 flex flex-col overflow-y-auto bg-slate-50">
    <main class="p-8">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
